packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks postinstall build scripts by default. These packages need
# theirs (native bindings / engine artifacts) and are trusted:
#   argon2       — node-gyp native bindings (required at runtime)
#   prisma       — CLI binary (migrate/generate)
#   @prisma/engines — engine artifacts
#   esbuild      — platform binary (Vite/vitest toolchain)
#   msw          — service-worker mock generation (web dev)
#   protobufjs, ssh2 — transitive natives (web/dev tooling)
#   sharp        — libvips native bindings (landing media pipeline, T2.1/A5)
onlyBuiltDependencies:
  - argon2
  - '@prisma/engines'
  - prisma
  - esbuild
  - msw
  - protobufjs
  - ssh2
  - sharp
